<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula de Alumnos 2026</title>
    <style>
        :root {
            --verde-oscuro: #1a5c3d;
            --verde-claro: #00a859;
            --gris-fondo: #e0e0e0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #fff; }
        
        header { 
            background-color: var(--verde-oscuro); 
            color: white; 
            padding: 20px; 
            text-align: center;
            border-bottom: 5px solid #d4af37; /* Detalle dorado opcional */
        }

        .main-container { display: flex; min-height: 90vh; }

        /* Sidebar */
        .sidebar { 
            width: 280px; 
            background-color: #fff; 
            padding: 20px; 
            border-right: 1px solid #ccc;
        }
        .sidebar h3 { color: #333; border-bottom: 2px solid var(--verde-claro); padding-bottom: 5px; }
        .grade-btn { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 8px; 
            background-color: var(--verde-claro); 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-weight: bold;
            text-align: left;
        }
        .grade-btn:hover { background-color: var(--verde-oscuro); }

        /* Contenido de Secciones */
        .content { flex-grow: 1; padding: 40px; background-color: var(--gris-fondo); }
        .content h2 { color: #000; margin-top: 0; }
        .sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .section-btn { 
            background-color: var(--verde-oscuro); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-size: 14px;
        }
        .section-btn:hover { opacity: 0.9; }

        /* Modal / Pop-up */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { 
            background: white; 
            margin: 2% auto; 
            padding: 0; 
            width: 450px; 
            border-radius: 8px; 
            position: relative; 
            overflow: hidden;
        }
        .modal-header { background: #fff; padding: 15px; text-align: center; position: relative; border-bottom: 1px solid #eee; }
        .modal-header h2 { margin: 0; font-size: 24px; color: #000; }
        .close { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #333; }
        
        form { padding: 20px; }
        form label { display: block; margin-top: 10px; color: #666; font-size: 14px; }
        form input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { 
            background-color: var(--verde-oscuro); 
            color: white; 
            width: 100%; 
            padding: 12px; 
            margin-top: 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Matrícula de Alumnos 2025</h1>
</header>

<div class="main-container">
    <div class="sidebar">
        <h3>Primaria</h3>
        <button class="grade-btn" onclick="showSections('1° Grado', ['A','B','C','D','E'])">1° Grado</button>
        <button class="grade-btn" onclick="showSections('2° Grado', ['A','B','C','D'])">2° Grado</button>
        <button class="grade-btn" onclick="showSections('3° Grado', ['A','B','C','D','E'])">3° Grado</button>
        <button class="grade-btn" onclick="showSections('4° Grado', ['A','B','C','D','E'])">4° Grado</button>
        <button class="grade-btn" onclick="showSections('5° Grado', ['A','B','C','D','E'])">5° Grado</button>
        <button class="grade-btn" onclick="showSections('6° Grado', ['A','B','C','D','E'])">6° Grado</button>

        <h3>Secundaria</h3>
        <button class="grade-btn" onclick="showSections('1° Sec', ['A','B','C','D','E'])">1° Sec</button>
        <button class="grade-btn" onclick="showSections('2° Sec', ['A','B','C','D','E'])">2° Sec</button>
        <button class="grade-btn" onclick="showSections('3° Sec', ['A','B','C','D','E'])">3° Sec</button>
        <button class="grade-btn" onclick="showSections('4° Sec', ['A','B','C','D','E'])">4° Sec</button>
        <button class="grade-btn" onclick="showSections('5° Sec', ['A','B','C','D'])">5° Sec</button>

            </div>

    <div class="content">
        <h2 id="view-title">Seleccione un grado</h2>
        <div id="sections-container" class="sections-grid">
            </div>
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">1° Grado "B"</h2>
        </div>
        <form id="registrationForm">
            <input type="hidden" id="input-grado-seccion" name="grado_seccion">
            
            <label>Nombre Completo del Alumno</label>
            <input type="text" name="nombre_alumno" placeholder="Nombre Completo del Alumno" required>
            
            <label>DNI del Alumno</label>
            <input type="text" name="dni_alumno" placeholder="DNI del Alumno" required>
            
            <label>Nombre completo del padre o apoderado</label>
            <input type="text" name="nombre_apoderado" placeholder="Nombre completo del padre o apoderado">
            
            <label>DNI del Padre o Apoderado</label>
            <input type="text" name="dni_padre" placeholder="DNI del Padre o Apoderado">
            
            <label>Número de Celular</label>
            <input type="text" name="celular" placeholder="Número de Celular">
            
            <label>Dirección</label>
            <input type="text" name="direccion" placeholder="Dirección">

            <button type="submit" id="btn-enviar" class="submit-btn">Enviar información</button>
        </form>
    </div>
</div>

<script>
    const sectionsContainer = document.getElementById('sections-container');
    const modal = document.getElementById('myModal');
    const form = document.getElementById('registrationForm');
    
    // REEMPLAZA ESTO CON TU URL DE GOOGLE APPS SCRIPT
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz24jFW2gOjO0gWPs9g20bBxBlyEXmMFh2jOZuImorgVShpu3c7mJSkArAKCa_u8bx3wg/exec';

    function showSections(grade, letters) {
        document.getElementById('view-title').innerText = "Secciones";
        sectionsContainer.innerHTML = ''; 
        
        letters.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'section-btn';
            // Formato de nombre: "1° Grado "A"" o "Aula 1 - Inicial "1° Grado""
            const fullTitle = `${grade} "${letter}"`;
            btn.innerText = fullTitle;
            btn.onclick = () => openModal(fullTitle);
            sectionsContainer.appendChild(btn);
        });
    }

    function openModal(title) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('input-grado-seccion').value = title;
        modal.style.display = "block";
    }

    function closeModal() { modal.style.display = "none"; }

    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('btn-enviar');
        btn.innerText = "Enviando...";
        btn.disabled = true;

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert("¡Matrícula registrada exitosamente!");
                closeModal();
                form.reset();
            })
            .catch(error => {
                alert("Error al enviar. Intente de nuevo.");
                console.error('Error!', error.message);
            })
            .finally(() => {
                btn.innerText = "Enviar información";
                btn.disabled = false;
            });
    });

    window.onclick = function(event) {
        if (event.target == modal) closeModal();
    }
</script>

</body>
</html>
